services:
  landing:
    build:
      context: .
    image: singha/landing:local
    restart: unless-stopped
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.docker.network=singha_public
      - traefik.http.routers.landing.rule=Host(`${LANDING_HOST:-singha.io}`)
      - traefik.http.routers.landing.entrypoints=websecure
      - traefik.http.routers.landing.tls.certresolver=letsencrypt
      - traefik.http.services.landing.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  public:
    name: singha_public
