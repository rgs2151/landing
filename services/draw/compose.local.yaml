name: singha-draw-preview

services:
  draw-backend:
    image: zimengxiong/excalidash-backend:${EXCALIDASH_VERSION:-0.5.1}
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/prisma/dev.db
      PORT: "8000"
      NODE_ENV: production
      AUTH_MODE: ${EXCALIDASH_AUTH_MODE:-local}
      TRUST_PROXY: "false"
      JWT_SECRET: ${EXCALIDASH_JWT_SECRET:-local-preview-jwt-secret-change-before-production}
      CSRF_SECRET: ${EXCALIDASH_CSRF_SECRET:-local-preview-csrf-secret-change-before-production}
      UPDATE_CHECK_OUTBOUND: ${EXCALIDASH_UPDATE_CHECK_OUTBOUND:-true}
    volumes:
      - ../../.local/state/draw/backend:/app/prisma
    networks:
      draw-local:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  draw-frontend:
    image: zimengxiong/excalidash-frontend:${EXCALIDASH_VERSION:-0.5.1}
    restart: unless-stopped
    depends_on:
      - draw-backend
    ports:
      - "${DRAW_PORT:-6767}:80"
    networks:
      - draw-local
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  draw-local:
