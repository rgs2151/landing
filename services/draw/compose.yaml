services:
  draw-backend:
    image: zimengxiong/excalidash-backend:${EXCALIDASH_VERSION:-0.5.1}
    restart: unless-stopped
    environment:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:/app/prisma/dev.db
      PORT: "8000"
      NODE_ENV: production
      AUTH_MODE: ${EXCALIDASH_AUTH_MODE:-local}
      TRUST_PROXY: "1"
      JWT_SECRET: ${EXCALIDASH_JWT_SECRET:?set EXCALIDASH_JWT_SECRET in infra/.env}
      CSRF_SECRET: ${EXCALIDASH_CSRF_SECRET:?set EXCALIDASH_CSRF_SECRET in infra/.env}
      UPDATE_CHECK_OUTBOUND: ${EXCALIDASH_UPDATE_CHECK_OUTBOUND:-true}
    volumes:
      - ${SINGHA_STATE_ROOT:-/srv/singha/state}/draw/backend:/app/prisma
    networks:
      private:
        aliases:
          - backend
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  draw-frontend:
    image: zimengxiong/excalidash-frontend:${EXCALIDASH_VERSION:-0.5.1}
    restart: unless-stopped
    depends_on:
      - draw-backend
    networks:
      - public
      - private
    labels:
      - traefik.enable=true
      - traefik.docker.network=singha_public
      - traefik.http.routers.draw.rule=Host(`${DRAW_HOST:-draw.singha.io}`)
      - traefik.http.routers.draw.entrypoints=websecure
      - traefik.http.routers.draw.tls.certresolver=letsencrypt
      - traefik.http.services.draw.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  public:
    name: singha_public
  private:
    name: singha_private
