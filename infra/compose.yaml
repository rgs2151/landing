name: singha

include:
  - path: ../apps/landing/compose.yaml
    project_directory: ../apps/landing
  - path: ../services/draw/compose.yaml
    project_directory: ../services/draw

services:
  proxy:
    image: traefik:v3.0
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set TRAEFIK_ACME_EMAIL in infra/.env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${SINGHA_STATE_ROOT:-/srv/singha/state}/traefik/letsencrypt:/letsencrypt
    networks:
      - public

networks:
  public:
    name: singha_public
  private:
    name: singha_private
