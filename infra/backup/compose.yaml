services:
  restic:
    image: restic/restic:0.19.1
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    volumes:
      - ${SINGHA_STATE_ROOT:-/srv/singha/state}:/data:ro
      - ${SINGHA_RESTIC_CACHE:-/srv/singha/cache/restic}:/cache
    entrypoint: ["restic", "--cache-dir", "/cache"]
